<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行情看板 · 基金智投</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 看板专属布局：左侧内容 + 右侧榜单 */
    .dash {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 16px;
      align-items: start;
    }
    .dash-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .dash-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
    }

    /* 基金卡片网格 */
    .fund-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
    }

    .fund-card {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 14px 15px;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .fund-card:hover {
      background: var(--panel-hover);
      border-color: #33425c;
      transform: translateY(-1px);
    }
    .fund-card.selected {
      border-color: var(--primary);
      background: var(--panel-active);
      box-shadow: 0 0 0 1px var(--primary-border) inset;
    }
    .fund-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .fund-code {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: .3px;
    }
    .fund-name {
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .fund-chg {
      font-family: var(--mono);
      font-size: 19px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: -.3px;
    }
    .fund-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-soft);
      font-size: 12px;
      color: var(--text-faint);
    }
    .fund-nav {
      font-family: var(--mono);
      color: var(--text-dim);
    }
    .fund-card .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      color: var(--text-faint);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    .fund-card:hover .remove-btn { display: flex; }
    .fund-card .remove-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* 图表卡片 */
    .chart-card { padding: 16px 16px 8px; }
    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .chart-title { font-size: 15px; font-weight: 600; }
    .chart-sub { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
    .ranges { display: flex; gap: 4px; }
    .range-btn {
      padding: 4px 11px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text-dim);
      transition: all .15s;
      border: 1px solid transparent;
    }
    .range-btn:hover { color: var(--text); background: var(--panel-hover); }
    .range-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .chart-stats {
      display: flex;
      gap: 22px;
      margin: 10px 0 2px;
      flex-wrap: wrap;
    }
    .chart-stat-label { font-size: 11px; color: var(--text-faint); }
    .chart-stat-value { font-family: var(--mono); font-size: 15px; font-weight: 600; }

    /* 榜单 */
    .rank-list { display: flex; flex-direction: column; }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13px;
      cursor: pointer;
    }
    .rank-item:last-child { border-bottom: none; }
    .rank-item:hover .rank-name { color: #fff; }
    .rank-index {
      width: 17px;
      height: 17px;
      border-radius: 5px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-hover);
      color: var(--text-faint);
      flex-shrink: 0;
      font-family: var(--mono);
    }
    .rank-item.top .rank-index { background: var(--up-soft); color: var(--up); }
    .rank-item.bottom .rank-index { background: var(--down-soft); color: var(--down); }
    .rank-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-dim);
    }
    .rank-val { font-family: var(--mono); font-weight: 600; flex-shrink: 0; }

    /* 搜索结果 */
    .search-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .search-result:hover { background: var(--panel-hover); border-color: var(--border); }

    @media (max-width: 1100px) {
      .dash { grid-template-columns: minmax(0, 1fr); }
      .dash-right { position: static; }
    }
  </style>
</head>
<body>
  <script src="js/config.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
