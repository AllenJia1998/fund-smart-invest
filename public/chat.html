<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>AI 对话 · 基金智投</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* ==========================================================================
       AI 对话页 · 页面级样式（三栏骨架：shell 侧边栏 + 对话区 + 会话历史）
       仅使用 app.css 的设计变量，保持与全站一致的深色语言。
       ========================================================================== */

    /* 让 .content 撑满可用高度，页面本身不产生滚动条（滚动交给各栏内部） */
    #content.chat-content {
      padding: 0;
      overflow: hidden;
      display: flex;
      min-height: 0;
    }

    .chat-wrap {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    /* ------------------------------ 中间：对话区 ------------------------------ */

    .chat-main {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* 顶部条：会话标题 + 能力挂载开关 */
    .chat-bar {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg-elevated);
    }
    .chat-bar-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }
    .chat-bar-title {
      font-size: 13.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 消息滚动区 */
    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 22px 8px;
      position: relative;
    }
    .chat-inner {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    /* 拖拽文件的落点提示 */
    .chat-main.dragging::after {
      content: '松开鼠标以添加附件';
      position: absolute;
      inset: 8px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--primary-border);
      border-radius: var(--radius);
      background: rgba(47, 111, 237, 0.1);
      color: #8fc4ff;
      font-size: 13px;
      pointer-events: none;
    }

    /* 空状态 */
    .chat-empty {
      height: 100%;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 40px;
    }
    .chat-empty-icon {
      width: 58px;
      height: 58px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border-radius: 18px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
    }
    .chat-empty h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .suggest {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 560px;
      margin-top: 22px;
    }
    .suggest button {
      padding: 11px 14px;
      text-align: left;
      font-size: 13px;
      color: var(--text-dim);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }
    .suggest button:hover {
      background: var(--panel-hover);
      border-color: var(--primary-border);
      color: var(--text);
      transform: translateY(-1px);
    }
    @media (max-width: 640px) {
      .suggest {
        grid-template-columns: 1fr;
      }
    }

    /* 消息气泡 */
    .msg {
      display: flex;
      margin-bottom: 18px;
    }
    .msg.user {
      justify-content: flex-end;
    }
    .bubble {
      min-width: 0;
      max-width: min(760px, 86%);
      padding: 11px 15px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .msg.assistant .bubble {
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-text {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-faint);
    }
    .msg.user .msg-meta {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.72);
      text-align: right;
    }

    /* 流式输出光标 */
    .bubble.streaming .md::after {
      content: '▍';
      color: var(--primary);
      animation: caret 1s steps(1) infinite;
    }
    @keyframes caret {
      50% {
        opacity: 0;
      }
    }
    .stream-error {
      margin: 8px 0;
      color: var(--danger);
    }

    /* 工具调用过程 */
    .tool-lines {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-soft);
    }
    .tool-line {
      display: flex;
      align-items: center;
      gap: 4px;
      line-height: 1.5;
    }
    .tool-line code {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #1b2434;
      color: #8fc4ff;
    }
    .tool-line.tool-bad {
      color: var(--danger);
    }
    .tool-line.tool-bad code {
      color: #ff8a99;
    }

    /* 消息内的附件信息 */
    .att-chips {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }
    .att-parsed {
      line-height: 1.5;
    }
    .msg.user .att-parsed {
      color: rgba(255, 255, 255, 0.86);
    }
    .att-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--panel-hover);
      border: 1px solid var(--border);
      color: var(--text-dim);
      max-width: 100%;
    }
    .msg.user .att-pill {
      background: rgba(255, 255, 255, 0.16);
      border-color: transparent;
      color: #fff;
    }

    /* ------------------------------ 底部输入区 ------------------------------ */

    .composer {
      flex-shrink: 0;
      padding: 12px 18px 14px;
      border-top: 1px solid var(--border-soft);
      background: var(--bg-elevated);
    }
    .composer-inner {
      max-width: 920px;
      margin: 0 auto;
    }
    .attach-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 9px;
    }
    .att-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 230px;
      padding: 4px 6px 4px 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--panel);
      font-size: 12px;
      color: var(--text-dim);
    }
    .att-chip img {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .att-chip .att-ico {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: var(--panel-hover);
    }
    .att-chip .att-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .att-del {
      flex-shrink: 0;
      padding: 0 3px;
      font-size: 12px;
      line-height: 1;
      color: var(--text-faint);
    }
    .att-del:hover {
      color: var(--danger);
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 7px 8px 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      transition: border-color 0.15s;
    }
    .composer-box:focus-within {
      border-color: var(--primary);
    }
    #composerInput {
      flex: 1;
      min-width: 0;
      min-height: 24px;
      max-height: 120px;
      padding: 4px 2px;
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      overflow-y: auto;
      line-height: 1.6;
    }
    #composerInput::placeholder {
      color: var(--text-faint);
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      font-size: 16px;
      color: var(--text-dim);
    }
    .icon-btn:hover {
      background: var(--panel-hover);
      color: var(--text);
    }
    .icon-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #btnSend {
      height: 34px;
      min-width: 74px;
      padding: 0 18px;
      flex-shrink: 0;
    }
    .composer-hint {
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-faint);
    }

    /* ------------------------------ 右侧：会话历史 ------------------------------ */

    .chat-side {
      width: 240px;
      flex-shrink: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-soft);
      background: var(--sidebar);
    }
    .side-head {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px 0 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    .side-head h3 {
      font-size: 13px;
      font-weight: 600;
    }
    .side-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hist-item {
      position: relative;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }
    .hist-item:hover {
      background: var(--panel-hover);
    }
    .hist-item.active {
      background: var(--primary-soft);
      box-shadow: inset 0 0 0 1px var(--primary-border);
    }
    .hist-title {
      padding-right: 22px;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hist-time {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-faint);
    }
    .hist-del {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .hist-item:hover .hist-del {
      display: flex;
    }
    .hist-del:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ------------------------------ 能力挂载弹窗 ------------------------------ */

    .cap-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .cap-row:last-child {
      border-bottom: none;
    }
    .cap-name {
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
    }
    .cap-desc {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-dim);
    }
    .kb-form {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--panel);
    }

    /* 开关（技能挂载） */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #243044;
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch .slider::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #8b9ab1;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .slider {
      background: var(--primary);
    }
    .switch input:checked + .slider::before {
      transform: translateX(16px);
      background: #fff;
    }
    .switch input:disabled + .slider {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 中等屏幕收窄历史栏；窄屏隐藏（避免挤压对话区） */
    @media (max-width: 1180px) {
      .chat-side {
        width: 200px;
      }
    }
    @media (max-width: 860px) {
      .chat-side {
        display: none;
      }
    }
  </style>
</head>
<body>
  <script src="js/config.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
