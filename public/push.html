<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>每日推送 · 基金智投</title>
    <link rel="stylesheet" href="css/app.css" />
    <style>
      /* ==========================================================================
         每日推送页面级样式（仅本页生效，不改动 app.css / app.js）
         目标：主内容区变成「左栏列表 + 右栏详情」两栏，各自独立滚动，
              页面本身不出现第二根滚动条（body 已是 overflow:hidden）。
         ========================================================================== */

      /* 主内容区改造为两栏容器：去掉自带内边距与滚动 */
      #content {
        padding: 0;
        overflow: hidden;
        display: flex;
      }

      .push-layout {
        display: flex;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }

      /* ------------------------------ 左栏：报告列表 ------------------------------ */
      .push-side {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-elevated);
        border-right: 1px solid var(--border-soft);
      }
      .push-side-head {
        flex-shrink: 0;
        padding: 14px;
        border-bottom: 1px solid var(--border-soft);
      }
      .push-side-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 8px 20px;
      }

      /* 日期分组头：吸顶，滚动时始终可见 */
      .push-group-hd {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 14px 10px 6px;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border-soft);
        letter-spacing: 0.4px;
      }

      /* 单条报告 */
      .push-item {
        position: relative;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .push-item:hover {
        background: var(--panel-hover);
      }
      .push-item.active {
        background: var(--panel-active);
        border-color: var(--primary-border);
      }
      .push-item-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
        padding-right: 24px;
      }
      .push-item-sum {
        margin-top: 3px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.5;
      }
      .push-item-meta {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      /* 悬停才出现的删除按钮 */
      .push-del {
        position: absolute;
        top: 6px;
        right: 6px;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--text-faint);
        opacity: 0;
        transition: opacity 0.15s, color 0.15s, background 0.15s;
      }
      .push-item:hover .push-del {
        opacity: 1;
      }
      .push-del:hover {
        color: var(--danger);
        background: rgba(245, 69, 92, 0.12);
      }

      /* 状态图标 */
      .st-icon {
        width: 14px;
        flex-shrink: 0;
        text-align: center;
        font-size: 12px;
        line-height: 1.5;
      }
      .st-ok {
        color: var(--success);
      }
      .st-bad {
        color: var(--danger);
      }
      .spin-blue {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 2px solid rgba(76, 154, 255, 0.25);
        border-top-color: var(--info);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      /* ------------------------------ 右栏：报告详情 ------------------------------ */
      .push-detail {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 20px 22px 48px;
      }
      .stack > * + * {
        margin-top: 14px;
      }
      .sec-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin: 20px 0 10px;
      }

      /* 结论卡片：左侧蓝色竖线强调 */
      .card-conclusion {
        border-left: 3px solid var(--primary);
      }

      /* 两列信息表（项目 / 详情 风格） */
      .kv {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .kv th {
        width: 84px;
        text-align: left;
        vertical-align: top;
        padding: 9px 12px 9px 0;
        color: var(--text-faint);
        font-weight: 500;
        font-size: 12px;
        line-height: 1.7;
        white-space: nowrap;
        border-top: 1px solid var(--border-soft);
      }
      .kv td {
        vertical-align: top;
        padding: 9px 0;
        color: var(--text-dim);
        line-height: 1.7;
        border-top: 1px solid var(--border-soft);
      }

      /* 置信度：数字 + 自绘进度条 */
      .conf {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .conf-end {
        justify-content: flex-end;
      }
      .bar {
        display: inline-block;
        flex: 1;
        max-width: 180px;
        height: 6px;
        border-radius: 999px;
        background: var(--panel-hover);
        overflow: hidden;
      }
      .bar-sm {
        max-width: 54px;
      }
      .bar-in {
        display: block;
        height: 100%;
        border-radius: 999px;
        transition: width 0.3s;
      }

      /* 阶段收益行 */
      .period-line {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--border-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
      }

      /* 资讯列表 */
      .news-item {
        padding: 10px 0;
        border-top: 1px solid var(--border-soft);
      }
      .news-item:first-child {
        border-top: none;
        padding-top: 2px;
      }
      .news-line {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .news-cats {
        display: inline-flex;
        gap: 4px;
        flex-shrink: 0;
        padding-top: 1px;
      }
      .news-title {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        line-height: 1.6;
      }
      a.news-title:hover {
        color: #6ea1ff;
        text-decoration: underline;
      }
      .news-meta {
        margin-top: 2px;
        padding-left: 0;
      }

      /* 居中状态块（生成中 / 加载中） */
      .detail-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 340px;
        height: 100%;
        padding: 40px 20px;
      }
      .spinner-lg {
        width: 26px;
        height: 26px;
        border-width: 3px;
      }
      .btn .spinner {
        width: 12px;
        height: 12px;
      }

      @media (max-width: 1000px) {
        .push-side {
          width: 260px;
        }
        .push-detail {
          padding: 16px 14px 40px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 页面外壳（侧边栏 + 顶栏）与全部内容由 js/push.js 通过 mountShell 注入 -->
    <script src="js/config.js"></script>
  <script type="module" src="js/push.js"></script>
  </body>
</html>
